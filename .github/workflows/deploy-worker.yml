name: deploy-worker

# Deploys the Cloudflare Worker when a v* tag is pushed, or manually
# via the Actions tab.
#
# Credentials are scoped to the `cloudflare` GitHub Environment (see
# `environment:` below), NOT repo-wide secrets. Store
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID as *environment*
# secrets on that environment, and add a deployment branch/tag rule
# limiting it to `main` + `v*`. Then only this job — on a release tag
# or a maintainer-run dispatch — can read the account-scoped token; a
# pull-request workflow cannot. See docs/deployment.md → "Securing the
# deploy credentials".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gates the account-scoped Cloudflare token behind environment
    # protection rules (allowed refs / optional required reviewers).
    environment: cloudflare
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      # The Worker bundles build/*.json, so the data must exist before
      # `wrangler deploy` runs (build/ is gitignored). The docs-site
      # assets are rebuilt by wrangler's `[build]` command (worker:assets)
      # during the deploy step below.
      - run: npm run fetch-spec
      - run: npm run build-spec

      - name: Install worker deps
        working-directory: worker
        run: npm ci

      - name: Deploy
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          sleep 5
          # The public /wasm/ endpoint is fronted by a gateway that
          # pretty-prints JSON ("status": "ok"), so match tolerant of
          # whitespace rather than the compact form.
          curl -fsS https://mcp.xyzzylabs.ai/wasm/health | tee /dev/stderr | grep -qE '"status":[[:space:]]*"ok"'
