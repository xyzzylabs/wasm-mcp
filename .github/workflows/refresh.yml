name: refresh

# Auto-refresh: SHA-diff the pinned upstream repos (WebAssembly/spec,
# WebAssembly/proposals) on a schedule. When a pin has moved, re-pin,
# bump the patch version, commit, and push a v* tag — which triggers
# the release (npm) and deploy-worker (Cloudflare) workflows.

on:
  schedule:
    # Daily at 06:00 UTC. The Wasm spec moves slowly; daily is ample.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # A tag pushed with the default GITHUB_TOKEN does NOT trigger
      # other workflows (GitHub's recursion guard), so the release +
      # deploy-worker workflows wouldn't fire. Check out with a PAT
      # (repo secret WORKFLOW_PAT, `contents: write` + `workflows`) so the
      # tag push it makes below triggers them. Falls back to the
      # default token: the re-pin commit + tag still land, but you'd
      # then run release / deploy manually.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.WORKFLOW_PAT || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Check upstream + re-pin
        id: refresh
        run: npm run refresh -- --apply

      # The remaining steps only run when a pin actually moved.
      - name: Rebuild + test against the new pin
        if: steps.refresh.outputs.moved == 'true'
        run: |
          npm run fetch-spec
          npm run build-spec
          npm test

      - name: Commit, tag, and push
        if: steps.refresh.outputs.moved == 'true'
        env:
          NEW_VERSION: ${{ steps.refresh.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vendor/PINNED.txt package.json .last-refresh.json
          git commit -m "Refresh pinned spec to v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin HEAD --tags
