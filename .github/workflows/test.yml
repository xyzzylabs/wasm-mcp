name: test

on:
  push:
    branches: [main]
  pull_request:

# Minimal explicit permissions — read-only for the default token.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: npm ci
      - run: npm audit signatures
      - run: npm run fetch-spec
      - run: npm run build-spec
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run docs:build
      - run: npm pack --dry-run

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The Worker bundles + imports build/*.json, so the data must
      # exist before the worker typecheck/tests run.
      - run: npm ci
      - run: npm run fetch-spec
      - run: npm run build-spec

      - name: Worker typecheck + tests
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
          npm test
