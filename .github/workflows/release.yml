name: release

# Publishes the npm package when a v* tag is pushed (by a human or by
# the refresh workflow).
#
# Auth is npm Trusted Publishing (OIDC) — NO long-lived NPM_TOKEN. The
# package must be configured with a trusted publisher pointing at this
# repo + workflow (npmjs.com → wasm-mcp → Settings → Trusted Publisher
# → GitHub Actions: org xyzzylabs, repo wasm-mcp, workflow release.yml).
# CI then mints a short-lived credential at publish time.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # `contents: write` for `gh release create`; read alone would do for
  # npm, but the GitHub Release step below needs write.
  contents: write
  # Enables the OIDC token request used by npm Trusted Publishing,
  # `npm publish --provenance`, and MCP Registry authentication.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # Do NOT set `registry-url:` here. setup-node would then write
          # an .npmrc with a NODE_AUTH_TOKEN auth line that takes
          # precedence over Trusted Publishing's OIDC path and makes
          # publish fail with a misleading 404. npm defaults to
          # registry.npmjs.org anyway.

      - name: Upgrade npm for Trusted Publishing
        # Node 22 ships npm 10.x; Trusted Publishing (OIDC) needs npm
        # >= 11.5.1. Pin to a known-good minor rather than @latest.
        run: npm install -g npm@^11.5

      - name: Verify tag matches package.json version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME (parsed as $tag) != package.json version $pkg"
            exit 1
          fi
          echo "Tag and version agree on $pkg"

      - run: npm ci
      # Regenerate the baked data from the pinned SHAs so the tarball
      # ships fresh indexes (build/ is gitignored).
      - run: npm run fetch-spec
      - run: npm run build-spec
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish to npm (Trusted Publishing)
        # No NODE_AUTH_TOKEN: the npm CLI auto-detects the GitHub Actions
        # OIDC environment (enabled by id-token: write above) and the
        # package's trusted-publisher config. `--provenance` signs the
        # publish into the sigstore transparency log (requires a public
        # repo). Idempotent: skip if this version is already on the
        # registry so a re-run after a later failure doesn't error.
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "wasm-mcp@$version" version 2>/dev/null)" = "$version" ]; then
            echo "wasm-mcp@$version already published — skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Post-publish smoke (install from registry + MCP roundtrip)
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "Waiting for wasm-mcp@$version on the registry..."
          for i in $(seq 1 10); do
            [ "$(npm view "wasm-mcp@$version" version 2>/dev/null)" = "$version" ] && break
            [ "$i" = "10" ] && { echo "Timed out waiting for registry propagation" >&2; exit 1; }
            sleep 30
          done
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"spec_version","arguments":{}}}' \
            | npx -y "wasm-mcp@$version" \
            | grep -q '"spec/main"' && echo "Smoke OK" || { echo "Smoke FAILED" >&2; exit 1; }

      - name: Install mcp-publisher
        # Prebuilt binary from the MCP Registry's GitHub releases.
        run: |
          curl -L \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Sync server.json version to the release tag
        # refresh.yml bumps package.json but not server.json, so keep the
        # Registry manifest in step with npm. jq idempotently rewrites
        # both the top-level and the npm package version.
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" \
            '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json
          jq '{version, "packages[0].version": .packages[0].version}' server.json

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry (OIDC)
        # No secret — the workflow's id-token: write covers it. The OIDC
        # sub claim carries the repo identity, which the Registry maps to
        # the io.github.xyzzylabs/* namespace (matches server.json's name).
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        # Republishing the same version is a hard error; bump version to
        # re-run. The Registry cross-checks the npm package's `mcpName`
        # field against server.json's name to prove ownership.
        run: ./mcp-publisher publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping."
            exit 0
          fi
          # Notes = this version's CHANGELOG section (## 0.1.0 … up to the
          # next ## heading); fall back to a generic note for cron PATCH
          # bumps that don't write a CHANGELOG entry.
          notes=$(awk -v ver="$version" '
            $0 ~ "^## (\\[)?"ver"(\\])?" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            notes="Automated PATCH refresh — upstream WebAssembly/spec or proposals moved. Same code, new spec data. See \`spec_version\` for the current SHAs."
          fi
          gh release create "$GITHUB_REF_NAME" --title "v$version" --notes "$notes" --verify-tag
