name = "wasm-mcp"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Runs before `wrangler deploy` and `wrangler dev`, so a bare
# `npx wrangler deploy` always rebuilds the VitePress docs site into
# worker/public/ (the static assets) from the current source. Requires
# the repo-root deps (`npm ci` at root) and the baked data
# (`npm run build-spec`) to exist — the Worker bundle imports build/*.json.
[build]
command = "cd .. && npm run worker:assets"

# Static landing page. The Worker dispatches /mcp, /health, and
# /privacy itself; everything else is served from this directory.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[vars]
LOG_LEVEL = "info"

# Built-in per-Worker rate limiter (Cloudflare's `ratelimit` binding).
# 30 requests / 60 s per client IP — generous for any human or agent
# workflow, tight enough to blunt scrapers. All spec data is bundled
# into the Worker, so requests do no I/O; this cap is purely abuse
# protection. Tune via the dashboard without re-deploying.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1101"
simple = { limit = 30, period = 60 }

[observability]
enabled = true
